    enabled: true

  - name: LinkedIn — Cleared Analyst Colorado Springs
    query: '"Program Analyst" OR "Intelligence Systems Analyst" "TS/SCI" "Colorado Springs" site:linkedin.com/jobs'
    enabled: true

  - name: LinkedIn — Space Force Civilian Colorado Springs
    query: '"Space Force" OR "USSF" "GS-13" OR "GS-14" OR "civilian" "Colorado Springs" OR "Peterson" OR "Schriever" site:linkedin.com/jobs'
    enabled: true

  - name: LinkedIn — Golden Dome / JADC2 / C3BM Colorado Springs
    query: '"Golden Dome" OR "JADC2" OR "C3BM" OR "all-domain command and control" OR "command and control" "Colorado Springs" OR "Peterson" OR "Schriever" site:linkedin.com/jobs'
    enabled: true

  - name: LinkedIn — Curriculum Instructional Design Cleared
    query: '"Curriculum Developer" OR "Instructional Designer" OR "Training Developer" OR "Technical Instructor" "TS/SCI" "Colorado Springs" OR "Space Force" site:linkedin.com/jobs'
    enabled: true

  - name: LinkedIn — AI Solutions Architect Cleared
    query: '"Solutions Architect" OR "AI Engineer" OR "Applied AI" "TS/SCI" OR "cleared" "Colorado Springs" OR "remote" site:linkedin.com/jobs'
    enabled: true

  - name: Work at a Startup — AI SA & FDE
    query: 'site:workatastartup.com "Solutions Architect" OR "Forward Deployed" OR "AI Engineer" OR "Agentic" remote'
    enabled: true

  - name: Dice — Cleared AI & Analytics Colorado Springs
    query: 'site:dice.com "AI" OR "Analytics" OR "Intelligence Analyst" "TS/SCI" "Colorado Springs" OR "Peterson" OR "Schriever"'
    enabled: true

  # -- AI/Data hybrid roles at defense primes (NEW) --
  - name: ClearanceJobs — AI & Data Hybrid Cleared
    query: 'site:clearancejobs.com "AI" OR "Artificial Intelligence" OR "Data Analyst" OR "Knowledge Management" OR "Digital Transformation" "TS/SCI" "Colorado Springs" OR "Peterson" OR "Schriever" OR "remote"'
